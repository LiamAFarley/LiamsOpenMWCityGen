[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procedural-tamriel-core"
version = "0.1.0"
description = "Deterministic procedural city generation core for OpenMW TES3 (Procedural Tamriel)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "Pillow",
    "scipy",
    "scikit-image",
    "shapely>=2.0",
]

[project.optional-dependencies]
compressed = ["zstandard"]
road-source = ["gimpformats"]
blender = ["bpy"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"procgen.schemas" = ["*.json"]
